name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - develop
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and build
        run: |
          cd bidfe
          npm install
          npm run build

      - name: Deploy to Firebase
        run: |
          cd bidfe
          npx firebase-tools deploy --only hosting --project bidyourcar --token ${{ secrets.FIREBASE_TOKEN }}
