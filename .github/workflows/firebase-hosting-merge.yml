name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
      - develop
permissions:
  contents: read
  id-token: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          VITE_API_URL: /api/v1
          VITE_WS_URL: wss://bidapi-7r2al76fma-uc.a.run.app/ws
        run: npm ci && npm run build
        working-directory: bidfe
        
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/521398647129/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-firebase@bidyourcarapp.iam.gserviceaccount.com'
          token_format: 'access_token'
          access_token_scopes: 'email, openid, https://www.googleapis.com/auth/cloudplatformprojects.readonly, https://www.googleapis.com/auth/firebase, https://www.googleapis.com/auth/cloud-platform'
          
      - name: Add Firebase to Project (if missing)
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" -H "Content-Type: application/json" -H "x-goog-user-project: bidyourcarapp" -d '{}' https://firebase.googleapis.com/v1beta1/projects/bidyourcarapp:addFirebase || true
          
      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase hosting:sites:create bidyourcarapp --project bidyourcarapp --token "${{ steps.auth.outputs.access_token }}" || true
          firebase deploy --non-interactive --only hosting --project bidyourcarapp --token "${{ steps.auth.outputs.access_token }}" --debug
        working-directory: bidfe
