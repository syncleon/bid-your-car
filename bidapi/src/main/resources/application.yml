spring:
  cache:
    type: ${SPRING_CACHE_TYPE:caffeine}
    redis:
      time-to-live: 600000
      cache-null-values: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
            redirect-uri: "${APP_FRONTEND_URL:http://localhost:5173}/login/oauth2/code/google"
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
    web:
      pageable:
        max-page-size: 100

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      jdbc:
        time_zone: UTC
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  address: 0.0.0.0
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    remote-ip-header: x-forwarded-for
    protocol-header: x-forwarded-proto
    internal-proxies: .*

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

cloudflare:
  r2:
    bucket: ${R2_BUCKET_NAME}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    endpoint: "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
    region: "auto"

imagekit:
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.web.access: TRACE

app:
  # Default to local development URL
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  nhtsa:
    api-url: ${NHTSA_API_URL:https://vpic.nhtsa.dot.gov/api/vehicles/decodevin}
  cookie:
    # Default to false for local development (HTTP)
    secure: ${APP_COOKIE_SECURE:false}
    # Default to Lax for local development
    same-site: ${APP_COOKIE_SAME_SITE:Lax}

  features:
    email-verification:
      enabled: ${APP_FEATURES_EMAIL_VERIFICATION_ENABLED:true}
