spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      jdbc:
        time_zone: UTC

  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: f251d039e25de7 # Можно тоже вынести в env, если нужно
    password: c01f28a5e4b9d7
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  address: 0.0.0.0
  port: 8080

jwt:
  secret:
    key: "thisissecretkeyformypersonalspringbootapp"
  expiration: 86400000

cors:
  allowed-origins: "
  http://localhost:5173,
  http://localhost:8080,
  https://bidfe-app.web.app,
