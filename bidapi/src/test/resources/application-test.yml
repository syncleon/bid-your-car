spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret:
    key: "this_is_a_very_long_secret_key_for_testing_only_do_not_use_in_prod_1234567890"
  expiration: 86400000

app:
  frontend-url: http://localhost:5173
  cookie:
    secure: false
    same-site: Lax

cloudflare:
  r2:
    bucket: "test-bucket"
    access-key: "test"
    secret-key: "test"
    endpoint: "https://test.com"
    region: "auto"

imagekit:
  url-endpoint: "https://ik.imagekit.io/test"
