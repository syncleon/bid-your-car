services:
  db:
    image: postgres:15
    container_name: car-auction-db
    restart: always
    environment:
      POSTGRES_DB: carauction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - car-auction-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
    container_name: car-auction-backend
    depends_on:
      - db
    environment:
      # Database Config
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/carauction
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # Cloudflare R2 Config
      # Слева - имя переменной внутри Spring (см. application.yml)
      # Справа - имя переменной в вашем .env файле
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}

      # ImageKit Config
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT}
    ports:
      - "8080:8080"
    restart: always

volumes:
  car-auction-data: