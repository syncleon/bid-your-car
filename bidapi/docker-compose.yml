services:
  # --- Database Service ---
  db:
    image: postgres:15-alpine
    container_name: car-auction-db
    restart: always
    environment:
      POSTGRES_DB: carauction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - car-auction-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: car-auction-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: car-auction-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "local-access-key"
      MINIO_ROOT_PASSWORD: "local-secret-key"
    ports:
      - "9000:9000" # API для бэкенда
      - "9001:9001" # Web UI панель (можно зайти через браузер)
    volumes:
      - minio-data:/data

  # Создание бакета при старте
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set myminio http://minio:9000 local-access-key local-secret-key;
      mc mb myminio/bidapi-local-bucket || true;
      mc anonymous set public myminio/bidapi-local-bucket;
      exit 0;
      "

  # --- Backend Service ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car-auction-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: always
    environment:
      # 1. Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/carauction
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

      # 2. Mail Configuration
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      # 3. Security Configuration
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      # 4. Storage Configuration
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CACHE_TYPE: redis

      # 5. Google auth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # 6. App & Cookie Settings
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_COOKIE_SAME_SITE: ${APP_COOKIE_SAME_SITE:-Lax}
      APP_FEATURES_EMAIL_VERIFICATION_ENABLED: ${APP_FEATURES_EMAIL_VERIFICATION_ENABLED:-false}

volumes:
  car-auction-data:
  minio-data: